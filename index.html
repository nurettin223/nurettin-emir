<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nurettin Emir - Sade & Modern Gym Portal</title>
    <style>
        /* Modern ve Sade Temel Tasarım (Dark & Neon Minimalist) */
        :root {
            --bg-color: #0f0f12;
            --card-bg: rgba(255, 255, 255, 0.03);
            --border-color: rgba(255, 255, 255, 0.08);
            --accent-color: #8a2be2; /* Neon Mor */
            --accent-cyan: #00f2fe; /* Neon Turkuaz */
            --text-color: #f1f2f6;
            --text-muted: #a4b0be;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            min-height: 100vh;
        }

        /* 💻 MASAÜSTÜ (PC) YAN MENÜ AYARLARI */
        .sidebar {
            width: 280px;
            background: rgba(15, 15, 18, 0.95);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 30px 20px;
            position: fixed;
            height: 100vh;
            box-sizing: border-box;
            justify-content: space-between;
            z-index: 100;
        }

        .sidebar-top h2 {
            font-size: 15px;
            font-weight: 800;
            letter-spacing: 0.5px;
            line-height: 1.4;
            margin-top: 0;
            margin-bottom: 40px;
            text-transform: uppercase;
            background: linear-gradient(45deg, var(--accent-cyan), var(--accent-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-buttons {
            display: flex;
            flex-direction: column;
        }

        .nav-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            padding: 14px 18px;
            text-align: left;
            font-size: 15px;
            cursor: pointer;
            border-radius: 8px;
            margin-bottom: 10px;
            transition: 0.3s ease;
            font-weight: 500;
        }

        .nav-btn:hover, .nav-btn.active {
            background: var(--card-bg);
            color: var(--text-color);
            border-left: 4px solid var(--accent-cyan);
            padding-left: 14px;
        }

        .verified-badge {
            background: linear-gradient(135deg, rgba(0, 242, 254, 0.1), rgba(138, 43, 226, 0.1));
            border: 1px solid rgba(0, 242, 254, 0.3);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.1);
            animation: pulse 2s infinite ease-in-out;
        }

        .verified-badge p {
            margin: 0;
            font-size: 11px;
            letter-spacing: 2px;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .verified-badge h4 {
            margin: 5px 0 0 0;
            font-size: 14px;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 0 8px rgba(0, 242, 254, 0.6);
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 15px rgba(0, 242, 254, 0.1); }
            50% { transform: scale(1.02); box-shadow: 0 0 25px rgba(0, 242, 254, 0.25); border-color: rgba(138, 43, 226, 0.5); }
            100% { transform: scale(1); box-shadow: 0 0 15px rgba(0, 242, 254, 0.1); }
        }

        /* PC Ana İçerik Alanı */
        .main-content {
            margin-left: 280px;
            flex: 1;
            padding: 40px;
            width: calc(100% - 280px);
            box-sizing: border-box;
        }

        .project-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .project-header .sub-tag {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 5px;
            color: var(--accent-cyan);
            font-weight: 700;
            display: block;
            margin-bottom: 5px;
        }

        .project-header h1 {
            font-size: 38px;
            font-weight: 900;
            margin: 0;
            letter-spacing: -1px;
            background: linear-gradient(135deg, #fff 30%, var(--text-muted));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .project-header .highlight-text {
            display: inline-block;
            margin-top: 8px;
            font-size: 16px;
            font-weight: 600;
            padding: 6px 16px;
            background: rgba(138, 43, 226, 0.15);
            border: 1px solid rgba(138, 43, 226, 0.3);
            border-radius: 50px;
            color: #dcdde1;
            text-shadow: 0 0 10px rgba(138, 43, 226, 0.5);
        }

        .page {
            display: none;
            max-width: 900px;
            margin: 0 auto;
        }

        .page.active {
            display: block;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 25px;
            backdrop-filter: blur(10px);
        }

        h3 {
            margin-top: 0;
            font-size: 22px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
            color: #fff;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: var(--text-muted);
        }

        input[type="email"], input[type="password"], input[type="number"] {
            width: 100%;
            padding: 12px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: #fff;
            font-size: 15px;
            box-sizing: border-box;
            transition: 0.3s;
        }

        input:focus {
            outline: none;
            border-color: var(--accent-cyan);
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.2);
        }

        .btn {
            background: linear-gradient(45deg, var(--accent-color), var(--accent-cyan));
            color: #fff;
            border: none;
            padding: 12px 24px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .workout-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .exercise-item {
            background: rgba(255, 255, 255, 0.01);
            border: 1px solid var(--border-color);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .exercise-info {
            display: flex;
            flex-direction: column;
        }

        .ex-name { font-weight: 600; font-size: 15px; }
        .ex-detail { font-size: 13px; color: var(--text-muted); margin-top: 4px; }

        .progress-container {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            height: 8px;
            width: 100%;
            margin-top: 15px;
            overflow: hidden;
        }

        .progress-bar {
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-color));
            width: 0%;
            height: 100%;
            transition: width 0.4s ease;
        }

        .game-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            align-items: center;
        }

        .clicker-area {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .stat-counter {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .dumbbell-btn {
            font-size: 70px;
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            width: 150px;
            height: 150px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.1s ease;
            user-select: none;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .dumbbell-btn:active {
            transform: scale(0.92);
            border-color: var(--accent-cyan);
        }

        .character-visual {
            margin-top: 20px;
            font-size: 14px;
            color: var(--text-muted);
        }
        .biceps-growth {

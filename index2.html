<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game - Ana Sayfa</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #2c3e50 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }
        .container {
            background: rgba(0, 0, 0, 0.8);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            width: 380px;
            text-align: center;
            border: 2px solid #2ecc71;
        }
        h1 { color: #2ecc71; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 2px; }
        p { color: #bdc3c7; margin-bottom: 30px; font-size: 14px; }
        
        .input-group { margin-bottom: 15px; text-align: left; }
        label { display: block; margin-bottom: 5px; font-size: 13px; color: #2ecc71; }
        input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #444;
            background: #222;
            color: white;
            outline: none;
        }
        input:focus { border-color: #2ecc71; }

        .btn-login {
            background: #2ecc71;
            color: #1a1a1a;
            border: none;
            padding: 15px;
            width: 100%;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }
        .btn-login:hover { background: #27ae60; transform: translateY(-2px); }

        .links {
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
            font-size: 13px;
        }
        .links a { color: #bdc3c7; text-decoration: none; transition: 0.2s; }
        .links a:hover { color: #2ecc71; }
        
        .register-text { margin-top: 25px; font-size: 14px; }
        .register-text a { color: #2ecc71; font-weight: bold; text-decoration: none; }
    </style>
</head>
<body>

    <div class="container">
        <h1>SNAKE v1.0</h1>
        <p>Oynamak için giriş yapın</p>

        <form onsubmit="event.preventDefault(); window.location.href='index1.html';">
            <div class="input-group">
                <label>Kullanıcı Adı</label>
                <input type="text" placeholder="Örn: ahmet123" required>
            </div>

            <div class="input-group">
                <label>Şifre</label>
                <input type="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-login">GİRİŞ YAP</button>
        </form>

        <div class="links">
            <a href="#" onclick="alert('Şifre sıfırlama bağlantısı e-postanıza gönderildi (Simülasyon).')">Şifremi Unuttum</a>
        </div>

        <div class="register-text">
            Hesabın yok mu? <a href="#" onclick="alert('Kayıt sistemi şu an bakımda, misafir girişi yapabilirsiniz.')">Kaydol</a>
        </div>
    </div>
</body>
</html>

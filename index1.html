<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <title>Yılan Oyunu - OYUN EKRANI</title>
    <style>
        body { display: flex; flex-direction: column; align-items: center; background-color: #1a1a1a; color: #2ecc71; font-family: sans-serif; }
        canvas { border: 5px solid #2ecc71; background-color: #000; }
    </style>
</head>
<body>
    <h2>Skor: <span id="scoreVal">0</span></h2>
    <canvas id="snakeGame" width="400" height="400"></canvas>
    <p style="color: white;">Çıkmak için sayfayı kapatabilirsin.</p>

    <script>
        // Önceki yılan oyunu kodlarının tamamını buraya yapıştıracaksın.
        // (Aşağıdaki temel mantığı buraya koyuyorum)
        const canvas = document.getElementById("snakeGame");
        const ctx = canvas.getContext("2d");
        const box = 20;
        let score = 0;
        let snake = [{x: 10*box, y: 10*box}];
        let food = {x: Math.floor(Math.random()*19)*box, y: Math.floor(Math.random()*19)*box};
        let d;

        document.addEventListener("keydown", e => {
            if((e.keyCode==37||e.keyCode==65)&&d!="RIGHT") d="LEFT";
            else if((e.keyCode==38||e.keyCode==87)&&d!="DOWN") d="UP";
            else if((e.keyCode==39||e.keyCode==68)&&d!="LEFT") d="RIGHT";
            else if((e.keyCode==40||e.keyCode==83)&&d!="UP") d="DOWN";
        });

        function draw() {
            ctx.fillStyle = "black";
            ctx.fillRect(0,0,400,400);
            for(let i=0; i<snake.length; i++){
                ctx.fillStyle = (i==0)?"#2ecc71":"#27ae60";
                ctx.fillRect(snake[i].x, snake[i].y, box, box);
            }
            ctx.fillStyle = "red";
            ctx.fillRect(food.x, food.y, box, box);
            
            let sX = snake[0].x; let sY = snake[0].y;
            if(d=="LEFT") sX-=box; if(d=="UP") sY-=box;
            if(d=="RIGHT") sX+=box; if(d=="DOWN") sY+=box;

            if(sX==food.x && sY==food.y){
                score++; document.getElementById("scoreVal").innerText=score;
                food = {x: Math.floor(Math.random()*19)*box, y: Math.floor(Math.random()*19)*box};
            } else { snake.pop(); }

            let newHead = {x:sX, y:sY};
            if(sX<0||sY<0||sX>=400||sY>=400) location.reload();
            snake.unshift(newHead);
        }
        setInterval(draw, 100);
    </script>
</body>
</html>
